name: Bug report
description: Report a reproducible problem in searxng-mcp.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a specific, reproducible bug. Include the exact setup and the smallest possible repro.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: Search, fetch, render, release, or Pages behavior that is failing.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the shortest path to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: searxng-mcp version
      placeholder: 0.1.0 or commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, transport, and SearXNG base URL if relevant.
      placeholder: |
        OS:
        Python:
        Transport:
        SearXNG base URL:
        Render enabled:
        Container or local install:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste any error output or relevant logs.
      render: shell
