site_name: searxng-mcp
site_description: 'SearXNG search MCP for Claude Code and Grok — privacy-respecting web search and page extraction for AI agents and any MCP client.'
site_author: 88plug
site_url: https://88plug.github.io/searxng-mcp/
repo_url: https://github.com/88plug/searxng-mcp
repo_name: 88plug/searxng-mcp
edit_uri: edit/main/docs/
use_directory_urls: true
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start here:
      - Getting Started: getting-started.md
      - Installation: installation.md
  - Run & deploy:
      - Configuration: configuration.md
      - Deployment: deployment.md
      - Security: security.md
  - Reference:
      - Tool Reference: reference/tools.md
      - Client Configs: reference/client-configs.md
      - Benchmarks: benchmarks.md
  - About:
      - FAQ: faq.md
      - Comparison: comparison.md
      - Changelog: changelog.md
